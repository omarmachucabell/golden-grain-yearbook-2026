<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10110f"><title>Team — Golden Grain Yearbook</title><link rel="stylesheet" href="visual.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700;800;900&amp;family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet">
<style id="team-editorial-styles">/* Isolated Team editorial experiment. */
body.team-editorial-page{background:#d7cbbd url("assets/team-directory-texture.jpeg") center center / cover no-repeat;min-height:100svh}
.team-editorial{color:#242620;--ink:#242620;--accent:#836431;position:relative;max-width:1600px;margin:auto;padding:52px 6% 32px;min-height:calc(100svh - 70px);isolation:isolate}
.team-editorial h1{position:relative;z-index:2;font:400 clamp(120px,22vw,320px)/.85 Anton,Impact,sans-serif;letter-spacing:-.055em;margin:0;pointer-events:none}
.team-editorial .editorial-stage{position:relative;min-height:650px}
.team-editorial .editorial-photo{position:absolute;right:0;top:clamp(90px,12vw,180px);width:57%;height:470px;margin:0;overflow:hidden;border-radius:3px;background:#d8d2c6;transform:rotate(2deg);transition:transform .7s cubic-bezier(.2,.65,.3,1)}
.team-editorial .editorial-photo img{position:absolute;width:100%;height:100%;inset:0;object-fit:cover;opacity:0;transform:scale(1.035);transition:opacity .55s ease,transform 1s ease;object-position:50% 44%}
.team-editorial .editorial-photo img:first-child{object-position:50% 62%}
.team-editorial .editorial-photo img.is-active{opacity:1;transform:scale(1)}
.team-editorial .editorial-photo img.portrait{object-fit:contain;background:#2c302a}
.team-editorial .editorial-links{position:relative;z-index:3;width:58%;margin-top:64px;padding-bottom:24px}
.team-editorial .editorial-link{display:block;width:fit-content;max-width:100%;position:relative;font:400 clamp(35px,4.8vw,70px)/1.08 Anton,Impact,sans-serif;letter-spacing:-.025em;text-transform:uppercase;padding:14px 0;color:var(--ink);transition:color .3s ease,transform .45s ease;text-decoration:none}
.team-editorial .editorial-link span{background:#eee9de;box-shadow:12px 0 #eee9de,-8px 0 #eee9de;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.team-editorial .editorial-link:nth-child(2){margin-left:5%}
.team-editorial .editorial-link:nth-child(3){margin-left:10%;max-width:75%}
.team-editorial .editorial-link.is-active{color:var(--accent);transform:translateX(8px)}
.team-editorial .editorial-link:focus-visible{outline:2px solid var(--accent);outline-offset:8px}
.team-editorial .editorial-link:active{transform:translateX(12px)}
.team-editorial .editorial-back{display:inline-block;margin-top:32px;font:500 12px/1.5 Inter,Arial,sans-serif;color:#626457;padding:12px 0}
.team-editorial[data-scene="1"] .editorial-photo{transform:rotate(-2deg)}
.team-editorial[data-scene="2"] .editorial-photo{transform:rotate(0deg)}
@media(min-width:1500px){.team-editorial .editorial-stage{min-height:760px}.team-editorial .editorial-photo{height:540px}}
@media(max-width:800px){.team-editorial{padding:38px 7% 24px}.team-editorial h1{font-size:clamp(110px,27vw,216px)}.team-editorial .editorial-stage{min-height:0}.team-editorial .editorial-photo{position:relative;width:91%;height:auto;aspect-ratio:1.25;top:auto;right:auto;margin:-10px 0 0 auto;transform:rotate(2deg)}.team-editorial .editorial-links{width:100%;margin-top:-18px;padding-bottom:0}.team-editorial .editorial-link{font-size:clamp(32px,7.8vw,61px);padding:14px 0}.team-editorial .editorial-link:nth-child(3){max-width:90%}.team-editorial .editorial-back{margin-top:28px}}
@media(prefers-reduced-motion:no-preference){.team-editorial h1{animation:team-type-in .8s both}.team-editorial .editorial-links{animation:team-type-in .8s .12s both}@keyframes team-type-in{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}}
@media(prefers-reduced-motion:reduce){.team-editorial *{animation:none!important;transition:none!important}}
</style></head><body class="team-editorial-page"><header class="topic-header"><a class="wordmark" href="index.html" aria-label="Golden Grain yearbook home">GOLDEN GRAIN <span>’26</span></a><nav class="topic-nav" aria-label="Yearbook sections"><a class="snapshot-nav-link" href="team-directory.html" data-active="true" aria-current="page">Team</a><a class="snapshot-nav-link" href="moments.html">Season Snapshot</a><a class="snapshot-nav-link" href="holidays.html">Holidays</a></nav></header><main class="team-editorial" aria-labelledby="directory-title" data-scene="0"><div class="editorial-stage"><h1 id="directory-title">TEAM</h1><figure class="editorial-photo" aria-hidden="true"><img class="is-active" src="assets/team-group-2026.jpg" alt="" fetchpriority="high" decoding="async"><img class="portrait" src="assets/team-2026/romeo.jpg" alt="" decoding="async"><img class="portrait" src="assets/team-2026/paris.jpg" alt="" decoding="async"></figure><nav class="editorial-links" aria-label="Team collections"><a class="editorial-link is-active" href="team.html" data-scene="0"><span>Meet the Team</span></a><a class="editorial-link" href="superlatives.html" data-scene="1"><span>Superlatives</span></a><a class="editorial-link" href="spotlight.html" data-scene="2"><span>Team Member<br>of the Week</span></a></nav></div><a class="editorial-back" href="index.html#yearbook">← All sections</a></main><dialog aria-label="Full-screen photograph"><button class="close" aria-label="Close photograph">✕</button><button class="photo-prev" aria-label="Previous photograph">←</button><img alt=""><button class="photo-next" aria-label="Next photograph">→</button><span class="photo-number"></span></dialog><script src="visual.js"></script><script>(()=>{const root=document.querySelector('.team-editorial');const links=[...root.querySelectorAll('.editorial-link')];const images=[...root.querySelectorAll('.editorial-photo img')];const mobile=matchMedia('(max-width:800px)');const reduce=matchMedia('(prefers-reduced-motion:reduce)');function show(i){root.dataset.scene=i;links.forEach((a,n)=>a.classList.toggle('is-active',n===i));images.forEach((im,n)=>im.classList.toggle('is-active',n===i));}links.forEach((a,i)=>{a.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch')show(i)});a.addEventListener('focus',()=>show(i));});let queued=false;function scrollScene(){queued=false;if(!mobile.matches||reduce.matches||root.contains(document.activeElement))return;const max=Math.max(1,document.documentElement.scrollHeight-innerHeight);const progress=Math.max(0,Math.min(1,scrollY/max));show(progress<.3?0:progress<.7?1:2);}addEventListener('scroll',()=>{if(!queued){queued=true;requestAnimationFrame(scrollScene)}},{passive:true});})();</script></body></html>
