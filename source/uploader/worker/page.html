<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Inbox — Golden Grain</title><meta name="theme-color" content="#eee9df"><style>
*{box-sizing:border-box}body{margin:0;background:#eee9df;color:#25251f;font:16px/1.5 system-ui,sans-serif}main{max-width:880px;margin:auto;padding:40px 24px 80px}.brand{font-size:12px;font-weight:800;letter-spacing:.2em;margin-bottom:64px}h1{font-size:clamp(36px,7vw,64px);line-height:1.04;letter-spacing:-.06em;font-weight:550;margin:0 0 20px}p{color:#66665d}input,button{font:inherit;border-radius:8px;padding:13px 16px}input{background:#fffcf5;border:1px solid #bfbdb0;min-width:0;width:100%}button{background:#292d25;color:#fff;border:0;cursor:pointer;min-height:48px}button:disabled{opacity:.55;cursor:wait}button.secondary{background:transparent;color:inherit;border:1px solid #bfbdb0}label{display:block;margin:24px 0 8px;font-size:14px;font-weight:600}#login{max-width:400px}#login button{margin-top:14px;width:100%}.drop{margin-top:24px;border:1px dashed #9b9e8b;border-radius:16px;background:#f7f4ed;padding:44px 24px;text-align:center}.drop.over{background:#e1e7d9}.drop p{margin-bottom:0;font-size:13px}#upload-input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}.row{display:flex;align-items:center;justify-content:space-between;gap:14px}#status{min-height:28px;margin:18px 0;font-size:14px}#queue{padding:0;list-style:none}#queue li{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid #d5d3c8;font-size:14px;overflow-wrap:anywhere}#photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.photo{margin:0;min-width:0}.photo img,.photo .fallback{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#dadccf;border-radius:10px}.fallback{display:grid!important;place-items:center;font-size:13px}.photo figcaption{font-size:13px;overflow-wrap:anywhere;margin-top:7px}.photo small{display:block;color:#717367}.section-title{font-size:18px;font-weight:550;margin:44px 0 20px}#more{margin-top:24px}a{color:inherit}button:focus-visible,input:focus-visible{outline:3px solid #8d9b61;outline-offset:4px}[hidden]{display:none!important}@media(max-width:520px){main{padding:26px 20px 60px}.brand{margin-bottom:46px}#photos{grid-template-columns:repeat(2,minmax(0,1fr))}.row{align-items:flex-start}.drop{padding:34px 16px}}
</style></head><body><main><div class="brand">GOLDEN GRAIN ’26</div><h1>Drop off your memories.</h1><p>Upload now. Decide where they go later.</p><form id="login"><label for="passcode">Passcode</label><input id="passcode" type="password" autocomplete="current-password" inputmode="numeric" required><button>Open photo inbox</button></form><section id="inbox" hidden><div class="row"><p>Photos are stored privately. Uploading won’t change the yearbook.</p><button id="lock" class="secondary">Lock</button></div><label for="batch">Batch name <span style="font-weight:400">(optional)</span></label><input id="batch" placeholder="e.g. Halloween, team portraits, closing night" maxlength="100"><div class="drop" id="drop"><button id="choose">Choose photos</button><input id="upload-input" type="file" accept="image/*,.heic,.heif" multiple aria-label="Choose photos to upload"><p>Select several at once, or drag them here.<br>Original files · Up to 30 MB each</p></div><ul id="queue" aria-label="Upload progress"></ul><button id="retry" hidden class="secondary">Retry failed uploads</button><h2 class="section-title">Stored photos</h2><div id="photos"></div><button id="more" class="secondary" hidden>Load more</button></section><div id="status" role="status" aria-live="polite"></div></main><script>
const $=s=>document.querySelector(s);let busy=false,failed=[],cursor=null;const known=new Set();
function status(t){$('#status').textContent=t}
async function api(url,options={}){const r=await fetch(url,options);const d=await r.json();if(!r.ok){if(r.status===401){$('#login').hidden=false;$('#inbox').hidden=true}throw Error(d.error||'Request failed')}return d}
function card(item){if(known.has(item.id))return;known.add(item.id);const f=document.createElement('figure');f.className='photo';const img=document.createElement('img');img.src=item.src;img.alt=item.name;img.loading='lazy';img.onerror=()=>{const fallback=document.createElement('div');fallback.className='fallback';fallback.textContent='Original photo stored';img.replaceWith(fallback)};const caption=document.createElement('figcaption');caption.textContent=item.name;const small=document.createElement('small');small.textContent=item.batch+' · '+new Date(item.uploadedAt).toLocaleDateString();caption.append(small);f.append(img,caption);$('#photos').append(f)}
async function load(reset=false){const d=await api('/api/photos'+(!reset&&cursor?'?cursor='+encodeURIComponent(cursor):''));if(reset){known.clear();$('#photos').replaceChildren()}d.items.sort((a,b)=>b.uploadedAt.localeCompare(a.uploadedAt)).forEach(card);cursor=d.cursor;$('#more').hidden=!cursor;$('#login').hidden=true;$('#inbox').hidden=false}
$('#login').onsubmit=async e=>{e.preventDefault();const button=e.currentTarget.querySelector('button');button.disabled=true;try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passcode:$('#passcode').value})});$('#passcode').value='';await load(true);status('Ready to upload.')}catch(e){status(e.message)}finally{button.disabled=false}};
$('#choose').onclick=()=>$('#upload-input').click();$('#upload-input').onchange=()=>upload([...$('#upload-input').files]);
async function upload(files){if(busy||!files.length)return;busy=true;failed=[];$('#retry').hidden=true;$('#queue').replaceChildren();$('#choose').disabled=true;$('#lock').disabled=true;$('#batch').disabled=true;const batch=$('#batch').value.trim();let success=0;
 for(const file of files){const row=document.createElement('li'),name=document.createElement('span'),state=document.createElement('span');name.textContent=file.name;state.textContent='Uploading…';row.append(name,state);$('#queue').append(row);status('Uploading '+(success+failed.length+1)+' of '+files.length+'. Keep this tab open.');try{if(file.size>30*1024*1024)throw Error('Over 30 MB');const result=await api('/api/upload?name='+encodeURIComponent(file.name)+'&batch='+encodeURIComponent(batch||'Unsorted'),{method:'POST',headers:{'Content-Type':file.type||'application/octet-stream'},body:file});state.textContent=result.duplicate?'Already stored':'Stored ✓';success++;card(result.item)}catch(e){state.textContent=e.message;failed.push(file)}}
 busy=false;$('#choose').disabled=false;$('#lock').disabled=false;$('#batch').disabled=false;$('#upload-input').value='';$('#retry').hidden=!failed.length;status(success+' of '+files.length+' photos stored'+(failed.length?'. '+failed.length+' failed; retry below.':'. You can close this page.'));}
$('#retry').onclick=()=>upload([...failed]);$('#more').onclick=async()=>{try{await load()}catch(e){status(e.message)}};$('#lock').onclick=async()=>{try{await api('/api/logout',{method:'POST'});$('#inbox').hidden=true;$('#login').hidden=false;$('#photos').replaceChildren();known.clear();status('Inbox locked.')}catch(e){status(e.message)}};
for(const type of ['dragenter','dragover'])$('#drop').addEventListener(type,e=>{e.preventDefault();$('#drop').classList.add('over')});$('#drop').addEventListener('dragleave',()=>$('#drop').classList.remove('over'));$('#drop').addEventListener('drop',e=>{e.preventDefault();$('#drop').classList.remove('over');upload([...e.dataTransfer.files])});addEventListener('beforeunload',e=>{if(busy){e.preventDefault();e.returnValue=''}});load(true).catch(()=>{});
</script></body></html>
