<style id="snapshot-archive-styles">
/* Season Snapshot archive: all styling is local to this document. */
.snapshot-archive{max-width:1480px;margin:auto;padding:46px 5vw 110px;color:#ece9df}
.snapshot-archive h1{font:500 clamp(22px,2.4vw,34px)/1.2 Inter,Arial,sans-serif;letter-spacing:-.045em;margin:0 0 32px}
.archive-feature,.archive-piece{display:block;color:inherit;text-decoration:none;min-width:0;outline-offset:8px}
.archive-window{position:relative;overflow:hidden;border-radius:10px;background:#20221e;isolation:isolate}
.archive-window img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover;object-position:var(--crop,center);filter:saturate(.7);transition:filter 1.2s ease,transform 1.5s cubic-bezier(.2,.65,.2,1)}
.archive-feature .archive-window{height:clamp(340px,54vw,660px);max-height:72svh}
.archive-feature .archive-window:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 55%,#080a09bd)}
.snapshot-archive h2{font:500 clamp(17px,1.6vw,23px)/1.25 Inter,Arial,sans-serif;letter-spacing:-.035em;margin:16px 0 0}
.archive-feature h2{position:absolute;bottom:clamp(24px,4vw,54px);left:clamp(24px,4vw,54px);z-index:2;font-size:clamp(28px,4vw,52px);font-weight:500;margin:0}
.archive-feature .archive-alternate{clip-path:inset(0 100% 0 0);transition:clip-path 1.4s cubic-bezier(.22,.7,.2,1)}
.archive-collections{display:flex;align-items:flex-start;gap:clamp(22px,3.2vw,48px);margin:64px 0 0}
.archive-piece:nth-child(1){flex:1.2;margin-top:35px}.archive-piece:nth-child(2){flex:.75;margin-top:110px}.archive-piece:nth-child(3){flex:1.05}.archive-piece:nth-child(4){flex:.9;margin-top:70px}
.archive-piece .archive-window{aspect-ratio:1.35}.archive-piece:nth-child(2) .archive-window{aspect-ratio:.9}.archive-piece:nth-child(3) .archive-window{aspect-ratio:1}.archive-piece:nth-child(4) .archive-window{aspect-ratio:1.5}
.archive-feature:focus-visible,.archive-piece:focus-visible{outline:2px solid var(--gold);border-radius:10px}
.archive-feature:focus-visible .archive-alternate{clip-path:inset(0)}
@media(hover:hover){.archive-feature:hover .archive-alternate{clip-path:inset(0)}.archive-piece:hover img{filter:saturate(1);transform:scale(1.04)}.archive-piece:hover h2{color:var(--gold)}}
.archive-feature:active,.archive-piece:active{opacity:.85}
@media(prefers-reduced-motion:no-preference){.snapshot-archive .archive-unseen img{filter:grayscale(1) brightness(.6);transform:scale(1.035)}.snapshot-archive .archive-unseen .archive-window{clip-path:inset(5% 0 5% 0)}.archive-window{transition:clip-path 1.2s cubic-bezier(.2,.65,.2,1)} }
@media(max-width:700px){.snapshot-archive{padding:32px 6vw 70px}.snapshot-archive h1{margin-bottom:24px}.archive-feature .archive-window{height:55svh;min-height:320px;max-height:520px}.archive-feature h2{left:24px;bottom:26px}.archive-collections{display:grid;grid-template-columns:1.1fr 1fr;gap:40px 22px;margin-top:40px}.archive-piece:nth-child(n){margin-top:0}.archive-piece:nth-child(even){transform:translateY(44px)}.archive-piece:nth-child(2) .archive-window{aspect-ratio:.85}.archive-piece:nth-child(3) .archive-window{aspect-ratio:1.1}.archive-piece:nth-child(4) .archive-window{aspect-ratio:1}.snapshot-archive h2{font-size:18px}.archive-feature h2{font-size:32px}}
@media(prefers-reduced-motion:reduce){.snapshot-archive *{transition:none!important}.archive-alternate{display:none}}
</style>
<style id="snapshot-atmosphere">
/* Isolated archive atmosphere. Remove this style and its paired script to revert. */
.snapshot-archive{position:relative;isolation:isolate}
.snapshot-archive:before{content:"";position:absolute;inset:40px 0 0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 9% 37%,#9d4e2826,transparent 44%),radial-gradient(ellipse at 90% 76%,#657c6b20,transparent 45%);opacity:.8}
.snapshot-archive:after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;opacity:.035;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.84' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23fff' filter='url(%23g)' opacity='.8' d='M0 0h180v180H0z'/%3E%3C/svg%3E")}
.snapshot-archive .archive-window{box-shadow:0 16px 36px -25px #000b}
.snapshot-archive .archive-window:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;box-shadow:inset 0 0 0 1px #ffffff17;background:linear-gradient(115deg,transparent 20%,#efc89b0d 46%,transparent 67%);border-radius:inherit}
.snapshot-archive .archive-feature .archive-window:before{background:radial-gradient(ellipse at 0% 45%,#ed9c4526,transparent 46%),linear-gradient(110deg,transparent 40%,#fff2d90a 53%,transparent 66%);mix-blend-mode:screen}
.snapshot-archive .archive-piece[href="throwbacks.html"] .archive-window:before{box-shadow:inset 0 0 35px #221a1855,inset 0 0 0 1px #e7d9b731;background:linear-gradient(115deg,#cf9f5815,transparent 65%)}
@media(prefers-reduced-motion:no-preference){
.snapshot-archive:before{animation:archive-room-light 22s ease-in-out infinite alternate}
.snapshot-archive .archive-feature .archive-window:before{animation:archive-exposure 16s ease-in-out infinite}
.snapshot-archive .archive-window img{scale:1.06;translate:var(--archive-x,0px) calc(var(--archive-y,0px) + var(--archive-scroll,0px));transition:translate 1.1s cubic-bezier(.2,.65,.2,1),filter 1.2s ease,transform 1.5s cubic-bezier(.2,.65,.2,1)}
.snapshot-archive .archive-piece[href="walkie.html"] .archive-window:after{content:"";position:absolute;inset:-35%;z-index:1;pointer-events:none;opacity:0;background:repeating-radial-gradient(ellipse at 50% 72%,transparent 0 24px,#eadcb51c 25px 26px,transparent 27px 50px);transition:opacity .7s;animation:archive-radio 5s ease-out infinite;animation-play-state:paused}
.snapshot-archive .archive-piece[href="walkie.html"]:is(:hover,:focus-visible,.archive-touch) .archive-window:after{opacity:.7;animation-play-state:running}
.snapshot-archive .archive-piece[href="videos.html"] .archive-window:after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(transparent 42%,#fff4d719 50%,transparent 58%);translate:0 -110%;transition:translate 1.6s cubic-bezier(.2,.6,.2,1)}
.snapshot-archive .archive-piece[href="videos.html"]:is(:hover,:focus-visible,.archive-touch) .archive-window:after{translate:0 110%}
.snapshot-archive .archive-piece:focus-visible img,.snapshot-archive .archive-touch img{filter:saturate(1);transform:scale(1.025)}
.snapshot-archive .archive-paused:before,.snapshot-archive .archive-paused .archive-window:after{animation-play-state:paused!important}
@keyframes archive-room-light{from{opacity:.45;transform:translateY(-12px)}to{opacity:.95;transform:translateY(22px)}}
@keyframes archive-exposure{0%,100%{opacity:.25}45%{opacity:.8}60%{opacity:.4}72%{opacity:.7}}
@keyframes archive-radio{from{transform:scale(.92)}to{transform:scale(1.12)}}
}
@media(prefers-reduced-motion:reduce){.snapshot-archive:before,.snapshot-archive:after,.snapshot-archive *{animation:none!important}.snapshot-archive .archive-window img{translate:none!important;scale:none!important}}
</style>

<script id="snapshot-atmosphere-motion">
(()=>{
 const root=document.querySelector('.snapshot-archive'),reduce=matchMedia('(prefers-reduced-motion: reduce)'),fine=matchMedia('(hover:hover) and (pointer:fine)');
 const pieces=[...root.querySelectorAll('.archive-feature,.archive-piece')];let queued=false;
 const update=()=>{queued=false;if(reduce.matches)return;const height=innerHeight;pieces.forEach(piece=>{const box=piece.getBoundingClientRect();if(box.bottom<0||box.top>height)return;const limit=Math.min(9,box.height*.012);const drift=Math.max(-limit,Math.min(limit,(height/2-box.top-box.height/2)*.025));piece.style.setProperty('--archive-scroll',drift.toFixed(2)+'px')})};
 const request=()=>{if(!queued&&!reduce.matches){queued=true;requestAnimationFrame(update)}};
 pieces.forEach(piece=>{
  piece.addEventListener('pointermove',event=>{if(reduce.matches||!fine.matches||event.pointerType==='touch')return;const box=piece.getBoundingClientRect();piece.style.setProperty('--archive-x',((event.clientX-box.left)/box.width*8-4).toFixed(2)+'px');piece.style.setProperty('--archive-y',((event.clientY-box.top)/box.height*6-3).toFixed(2)+'px')},{passive:true});
  piece.addEventListener('pointerleave',()=>{piece.style.setProperty('--archive-x','0px');piece.style.setProperty('--archive-y','0px')});
 });
 if('IntersectionObserver' in window){const observer=new IntersectionObserver(entries=>entries.forEach(({target,isIntersecting})=>{target.classList.toggle('archive-paused',!isIntersecting);target.classList.toggle('archive-touch',isIntersecting&&!fine.matches);if(isIntersecting)request()}),{threshold:.35});pieces.forEach(p=>observer.observe(p))}
 addEventListener('scroll',request,{passive:true});addEventListener('resize',request,{passive:true});reduce.addEventListener('change',()=>{pieces.forEach(p=>{p.style.removeProperty('--archive-scroll');p.style.removeProperty('--archive-x');p.style.removeProperty('--archive-y')});request()});request();
})();
</script>
