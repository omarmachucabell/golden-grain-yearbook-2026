<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Manager — Golden Grain</title><link rel="stylesheet" href="/manager.css"></head><body><header><a href="/">GOLDEN GRAIN ’26</a><span>Photo manager</span><button id="logout" hidden>Lock</button></header><main><section id="login"><h1>Your season,<br>your photographs.</h1><p>Unlock to upload, organize, and publish.</p><form id="login-form"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>Unlock photo manager</button></form></section><section id="editor" hidden><div class="heading"><div><h1>Photo library</h1><p>Changes stay in a draft until you publish.</p></div><div class="actions"><a id="preview" href="/team.html?preview=1" target="_blank" rel="noopener">Preview draft ↗</a><button id="publish">Publish changes</button></div></div><label for="collection">Choose a collection</label><select id="collection"><option value="people">Team portraits</option></select><div class="toolbar"><p id="hint"></p><label class="upload-button" id="bulk-label" hidden>Add photos<input id="bulk" type="file" accept="image/*" multiple hidden></label></div><div id="grid"></div></section><p id="status" role="status" aria-live="polite"></p></main><dialog id="adjust"><form method="dialog"><button class="close" aria-label="Close adjustments">✕</button></form><h2>Adjust photograph</h2><div class="crop-preview"><img id="crop-image" alt="Crop preview"></div><label>Horizontal framing<input type="range" id="crop-x" min="0" max="100" value="50"></label><label>Vertical framing<input type="range" id="crop-y" min="0" max="100" value="50"></label><button id="rotate">Rotate 90°</button><button id="save-crop">Save framing</button><p>Framing follows each page’s photo shape. Rotation creates a new copy.</p></dialog><script src="/manager.js"></script></body></html>
